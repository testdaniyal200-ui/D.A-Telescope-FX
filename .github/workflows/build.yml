name: Build D.A Production Telescope FX

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate presets & GUI assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run project tests
        run: python -m unittest discover -s tests -v

  windows-vst3:
    name: Windows x64 VST3
    runs-on: windows-2022
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE / Visual Studio x64
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        shell: pwsh
        run: cmake --build build --config Release --target DA_Telescope_VST3 --parallel 4
      - name: Package Windows VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst = Get-ChildItem -Path build/DA_Telescope_artefacts/Release/VST3 -Filter *.vst3 | Select-Object -First 1
          if ($null -eq $vst) { throw 'VST3 bundle missing' }
          Compress-Archive -Path $vst.FullName -DestinationPath dist/DA_Telescope_Windows_x64_VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DA-Telescope-Windows-x64-VST3
          path: dist/DA_Telescope_Windows_x64_VST3.zip
          if-no-files-found: error

  macos-au:
    name: macOS Universal AU + VST3
    runs-on: macos-15
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE / Xcode Universal
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build AU and VST3
        run: cmake --build build --config Release --target DA_Telescope_AU DA_Telescope_VST3 --parallel 4
      - name: Package macOS plugins
        run: |
          mkdir -p dist
          AU=$(find build/DA_Telescope_artefacts/Release/AU -maxdepth 1 -name '*.component' -type d -print -quit)
          VST3=$(find build/DA_Telescope_artefacts/Release/VST3 -maxdepth 1 -name '*.vst3' -type d -print -quit)
          test -n "$AU" && test -n "$VST3"
          ditto -c -k --sequesterRsrc --keepParent "$AU" dist/DA_Telescope_macOS_Universal_AU.zip
          ditto -c -k --sequesterRsrc --keepParent "$VST3" dist/DA_Telescope_macOS_Universal_VST3.zip
          lipo -info "$AU/Contents/MacOS/"* || true
      - uses: actions/upload-artifact@v4
        with:
          name: DA-Telescope-macOS-Universal-AU-VST3
          path: dist/*.zip
          if-no-files-found: error
